name: Generar tablas CoolProp

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar CoolProp
        run: python -m pip install CoolProp==8.0.0

      - name: Generar tablas
        run: python generate_pt.py

      - name: Guardar tablas en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pt_data.js
          git commit -m "Añadir tablas P-T CoolProp" || echo "Sin cambios"
          git push
